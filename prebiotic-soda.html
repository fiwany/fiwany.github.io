async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.i,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.n)},key,u(D.c));
  const m=document.querySelector("main.lock");m.outerHTML=new TextDecoder().decode(pt);["fwInit","fwInit2","fwTool"].forEach(f=>{if(window[f])window[f]()});
  try{sessionStorage.setItem("fw_pw",pw)}catch(e){}
}

window.fwInit=function(){
 // grow-in animation for charts
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.3});
 document.querySelectorAll(".grow,.shelf,.funnel").forEach(el=>io.observe(el));
 // snapshot: highlight a sample size
 document.querySelectorAll(".snapwrap").forEach(w=>{
   w.querySelectorAll(".ntog button").forEach(b=>{
     const on=()=>{w.dataset.hl=b.dataset.n}, off=()=>{delete w.dataset.hl};
     b.addEventListener("mouseenter",on);b.addEventListener("focus",on);b.addEventListener("mouseleave",off);b.addEventListener("blur",off);
     b.addEventListener("click",()=>{w.dataset.hl===b.dataset.n?off():on()});
   });
 });
 // linkage map: drag nodes, edges follow
 document.querySelectorAll("svg.lmap").forEach(svg=>{
   const pos={};
   svg.querySelectorAll(".node").forEach(n=>{const m=n.getAttribute("transform").match(/translate\(([-\d.]+),([-\d.]+)\)/);pos[n.dataset.id]=[+m[1],+m[2]]});
   const draw=()=>svg.querySelectorAll("line").forEach(l=>{const a=pos[l.dataset.a],b=pos[l.dataset.b];l.setAttribute("x1",a[0]);l.setAttribute("y1",a[1]);l.setAttribute("x2",b[0]);l.setAttribute("y2",b[1])});
   draw();
   let drag=null,off=[0,0];
   const pt=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
   svg.querySelectorAll(".node").forEach(n=>{
     n.addEventListener("pointerdown",ev=>{drag=n;const p=pt(ev);const c=pos[n.dataset.id];off=[c[0]-p.x,c[1]-p.y];n.setPointerCapture(ev.pointerId);n.classList.add("drag");svg.querySelector(".nodes").appendChild(n);ev.preventDefault()});
     n.addEventListener("pointermove",ev=>{if(drag!==n)return;const p=pt(ev);const R=svg.getBoundingClientRect(),M=svg.getScreenCTM().inverse();
        const tl=new DOMPoint(R.left,R.top).matrixTransform(M),br=new DOMPoint(R.right,R.bottom).matrixTransform(M);
        const x=Math.max(tl.x+30,Math.min(br.x-30,p.x+off[0])),y=Math.max(tl.y+30,Math.min(br.y-30,p.y+off[1]));
        pos[n.dataset.id]=[x,y];n.setAttribute("transform","translate("+x+","+y+")");draw()});
     const up=()=>{if(drag===n){n.classList.remove("drag");drag=null}};
     n.addEventListener("pointerup",up);n.addEventListener("pointercancel",up);
     n.addEventListener("mouseenter",()=>{svg.querySelectorAll("line").forEach(l=>{if(l.dataset.a===n.dataset.id||l.dataset.b===n.dataset.id)l.classList.add("hl")})});
     n.addEventListener("mouseleave",()=>svg.querySelectorAll("line.hl").forEach(l=>l.classList.remove("hl")));
   });
 });
};
fwInit();
</script><script>
window.fwInit2=function(){
 document.querySelectorAll(".toolwrap").forEach(w=>w.querySelectorAll(".tstep").forEach(st=>{const on=()=>w.dataset.hl=st.dataset.r,off=()=>delete w.dataset.hl;
   st.addEventListener("mouseenter",on);st.addEventListener("focus",on);st.addEventListener("mouseleave",off);st.addEventListener("blur",off)}));
 document.querySelectorAll(".changed").forEach(c=>{const li=c.querySelector("li[data-map]");if(!li)return;
   const show=()=>c.classList.add("show");li.addEventListener("mouseenter",show);li.addEventListener("focus",show);li.addEventListener("click",show);
   c.querySelector(".mapwrap").addEventListener("click",show)});
 // copy hex
 document.querySelectorAll(".sw").forEach(b=>b.addEventListener("click",()=>{try{navigator.clipboard.writeText(b.dataset.hex)}catch(e){};b.classList.add("ok");setTimeout(()=>b.classList.remove("ok"),1200)}));
 // chart toggles
 document.querySelectorAll(".apwrap").forEach(w=>w.querySelectorAll(".ctog button").forEach(b=>{
   const on=()=>w.dataset.hl=b.dataset.s,off=()=>delete w.dataset.hl;
   b.addEventListener("mouseenter",on);b.addEventListener("focus",on);b.addEventListener("mouseleave",off);b.addEventListener("blur",off)}));
 // soda: hover a dot or card highlights its partner
 document.querySelectorAll(".fitscale").forEach(w=>{
   const set=c=>{w.querySelectorAll("[data-code]").forEach(x=>x.classList.toggle("on",x.dataset.code===c));w.classList.toggle("hl",!!c)};
   w.querySelectorAll("[data-code]").forEach(x=>{x.addEventListener("mouseenter",()=>set(x.dataset.code));x.addEventListener("focus",()=>set(x.dataset.code));x.addEventListener("mouseleave",()=>set(null));x.addEventListener("blur",()=>set(null))});
 });
};
fwInit2();

 document.querySelectorAll(".toolwrap").forEach(w=>w.querySelectorAll(".tstep").forEach(st=>{const on=()=>w.dataset.hl=st.dataset.r,off=()=>delete w.dataset.hl;
   st.addEventListener("mouseenter",on);st.addEventListener("focus",on);st.addEventListener("mouseleave",off);st.addEventListener("blur",off)}))};
