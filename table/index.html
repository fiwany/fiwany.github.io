<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fiwany's Table</title>
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--t-bg:#fbf7ef;--t-ink:#231f20;--t-muted:#6b6460;--t-table:#efe3cf;--t-table2:#e4d3b7;--t-rim:#d6c2a0}
body{background:var(--t-bg);overflow-x:hidden}
.t-intro{text-align:center;padding:28px 16px 0}
.t-intro h1{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(28px,5vw,46px);margin:8px 0 6px}
.t-intro p{color:var(--t-muted);margin:0;font-size:15px}
.t-stage{position:relative;width:min(1000px,100vw);height:clamp(420px,112vw,660px);margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.t-stage.drag{cursor:grabbing}
.t-top{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--t-table),var(--t-table2));box-shadow:0 26px 40px -18px rgba(60,40,20,.35),inset 0 -7px 0 var(--t-rim)}
.t-ring{position:absolute;border-radius:50%;border:2px dashed rgba(120,90,50,.18)}
.t-dot{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(120,90,50,.22)}
.t-plate{position:absolute;left:0;top:0;border:0;padding:0;background:none;cursor:pointer;transform-origin:50% 100%}
.t-plate .rim{position:absolute;left:0;right:0;bottom:0;height:38%;border-radius:50%;background:#fff;box-shadow:0 7px 10px -5px rgba(60,40,20,.4),inset 0 -3px 0 #ece5d9}
.t-plate .pic{position:absolute;left:12%;right:12%;bottom:13%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 6px 12px rgba(60,40,20,.25);background:#fff}
.t-plate .pic img{width:100%;height:100%;object-fit:cover;display:block}
.t-plate:focus-visible{outline:none}.t-plate:focus-visible .pic{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--t-ink)}
.t-me{position:absolute;pointer-events:none}
.t-me img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}
.t-me img.on{visibility:visible}
.t-shadow{position:absolute;border-radius:50%;background:radial-gradient(rgba(60,40,20,.3),transparent 70%);pointer-events:none}
.t-ctrl{display:flex;justify-content:center;gap:14px;margin:4px 0 18px}
.t-ctrl button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--t-ink);background:transparent;font-size:18px;cursor:pointer;color:var(--t-ink)}
.t-ctrl button:hover{background:var(--t-ink);color:var(--t-bg)}
.t-card{text-align:center;padding:0 16px 56px;min-height:160px}
.t-pill{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px;color:#fff;background:var(--c)}
.t-pill.y{color:#513e36}
.t-card h2{font-family:"Playfair Display",serif;font-size:clamp(24px,4vw,34px);margin:12px 0 4px}
.t-card p{margin:0 0 14px;color:var(--t-muted)}
.t-card a.go{color:var(--t-ink);font-weight:600;font-size:14px;letter-spacing:.06em;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:2px}
</style>
</head>
<body>
<header class="nav"><a class="logo" href="../index.html" data-t="Fiwany Wijaya">Fiwany Wijaya</a>
<button class="burger" aria-label="Menu" aria-expanded="false" onclick="var h=this.parentNode;h.classList.toggle('open');this.setAttribute('aria-expanded',h.classList.contains('open'))"><span></span><span></span><span></span></button>
<nav><a href="../index.html#work" data-t="Work">Work</a><a href="../about.html" data-t="About">About</a><a href="../Fiwany_Wijaya_Resume.pdf" target="_blank" rel="noopener" data-t="Resume">Resume</a><a href="mailto:fiwanyw@gmail.com" data-t="Contact">Contact</a></nav></header>

<section class="t-intro">
  <h1>Pull up a seat</h1>
  <p>Spin the table to see what I’ve been cooking up.</p>
</section>
<div class="t-stage" id="stage" aria-label="Projects on a lazy susan">
  <div class="t-top" id="top"></div>
  <div class="t-ring" id="ring"></div>
  <div class="t-shadow" id="shadow"></div>
  <div class="t-me" id="me" aria-hidden="true"></div>
</div>
<div class="t-ctrl"><button id="prev" aria-label="Previous project">←</button><button id="next" aria-label="Next project">→</button></div>
<section class="t-card" id="card" aria-live="polite"></section>

<script>
(async function(){
  const P = await fetch('projects.json').then(r=>r.json());
  // Outfit for each category. Swap in new outfit folders as they're drawn.
  const OUTFIT = {'Food Science':'lab','Consumer Research':'lab','Design':'lab'};
  const VIEWS = ['front','q','side','back','side-r','q-r'];

  const $=id=>document.getElementById(id);
  const stage=$('stage'), me=$('me'), top=$('top'), ring=$('ring'), shadow=$('shadow'), card=$('card');
  const N=P.length, STEP=360/N;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // character frames for every outfit
  const sprites={};
  [...new Set(Object.values(OUTFIT))].forEach(o=>{
    sprites[o]=VIEWS.map(v=>{const im=new Image();im.src=`img/${o}-${v}.png`;im.alt='';me.appendChild(im);return im;});
  });
  let outfit=OUTFIT[P[0].cat], frame=0;
  function show(o,f){ Object.values(sprites).flat().forEach(im=>im.classList.remove('on')); sprites[o][f].classList.add('on'); }

  const plates=P.map((p,i)=>{
    const b=document.createElement('button');
    b.className='t-plate'; b.style.setProperty('--c',p.col==='#febe10'?'#febe10':p.col);
    b.setAttribute('aria-label',p.title+', '+p.cat);
    b.innerHTML=`<span class="rim"></span><span class="pic"><img src="img/${p.img}" alt="" draggable="false"></span>`;
    b.addEventListener('click',()=>{ if(moved) return; if(nearestIndex()===i) location.href='../'+p.slug+'.html'; else goTo(i); });
    stage.appendChild(b); return b;
  });
  const dots=[...Array(36)].map(()=>{const d=document.createElement('span');d.className='t-dot';stage.appendChild(d);return d;});

  let W,H,cx,cy,Rx,Ry,ps,meH;
  function layout(){
    W=stage.clientWidth; H=stage.clientHeight;
    cx=W/2; cy=H*.64; Rx=Math.min(W*.39,390); Ry=Rx*.34; ps=Math.max(70,Math.min(124,W*.135));
    meH=Math.min(H*.66,Rx*1.25);
    const tw=Rx*2+ps*1.15, th=Ry*2+ps*.7;
    Object.assign(top.style,{left:cx-tw/2+'px',top:cy-th/2+'px',width:tw+'px',height:th+'px'});
    const sw=Rx*2, sh=Ry*2;
    Object.assign(ring.style,{left:cx-sw/2+'px',top:cy-sh/2+'px',width:sw+'px',height:sh+'px'});
    const mw=meH*280/600;
    Object.assign(me.style,{left:cx-mw/2+'px',top:cy-meH+Ry*.1+'px',width:mw+'px',height:meH+'px'});
    Object.assign(shadow.style,{left:cx-mw*.5+'px',top:cy+Ry*.1-mw*.11+'px',width:mw+'px',height:mw*.22+'px'});
    plates.forEach(b=>{b.style.width=ps+'px';b.style.height=ps+'px';});
  }

  let theta=0, vel=0, target=0, dragging=false, moved=false;
  const mod=(a,m)=>((a%m)+m)%m;
  const nearestIndex=()=>mod(Math.round(-theta/STEP),N);

  function render(){
    plates.forEach((b,i)=>{
      const phi=(theta+i*STEP)*Math.PI/180, d=Math.cos(phi), s=.7+.3*(d+1)/2;
      const x=cx+Rx*Math.sin(phi), y=cy+Ry*d;
      b.style.transform=`translate(${x-ps/2}px,${y-ps*.86}px) scale(${s})`;
      b.style.zIndex=d>-.1?200+Math.round(d*50):50+Math.round(d*40);
    });
    dots.forEach((el,j)=>{
      const phi=(theta+j*10)*Math.PI/180;
      el.style.transform=`translate(${cx+Rx*.6*Math.sin(phi)}px,${cy+Ry*.6*Math.cos(phi)}px)`;
    });
    me.style.zIndex=150; shadow.style.zIndex=149;
  }

  // a quick twirl; the outfit changes while her back is turned
  let twirling=null;
  function twirl(dir,newOutfit){
    if(reduce){ outfit=newOutfit; show(outfit,0); return; }
    const seq=dir>0?[1,2,3,4,5,0]:[5,4,3,2,1,0]; let k=0;
    clearInterval(twirling);
    twirling=setInterval(()=>{ const f=seq[k++]; if(f===3) outfit=newOutfit; show(outfit,f); if(k>=seq.length) clearInterval(twirling); },65);
  }

  function showCard(i){
    const p=P[i];
    card.innerHTML=`<span class="t-pill${p.col==='#febe10'?' y':''}" style="--c:${p.col}">${p.cat}</span><h2>${p.title}</h2><p>${p.kind}</p><a class="go" href="../${p.slug}.html">Open project →</a>`;
  }

  let last=performance.now(), lastIdx=0;
  function tick(t){
    const dt=Math.min(40,t-last)/16.67; last=t;
    if(!dragging){
      if(Math.abs(vel)>.15){ theta+=vel*dt; vel*=Math.pow(.93,dt); target=Math.round(theta/STEP)*STEP; }
      else { vel=0; theta+=(target-theta)*(reduce?1:Math.min(1,.12*dt)); }
    }
    const idx=nearestIndex();
    if(idx!==lastIdx){ const dir=mod(idx-lastIdx,N)<N/2?1:-1; lastIdx=idx; showCard(idx); twirl(dir,OUTFIT[P[idx].cat]); }
    render(); requestAnimationFrame(tick);
  }

  const step=n=>{ target=Math.round(theta/STEP)*STEP-n*STEP; vel=0; };
  function goTo(i){ let d=mod(i-nearestIndex(),N); if(d>N/2) d-=N; step(d); }
  $('prev').onclick=()=>{ step(-1); pause(6000); };
  $('next').onclick=()=>{ step(1); pause(6000); };
  addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') $('prev').click(); if(e.key==='ArrowRight') $('next').click(); });

  // Auto-turn: one plate every few seconds while nobody is interacting.
  let hover=false, pausedUntil=0;
  const pause=ms=>{ pausedUntil=performance.now()+ms; };
  stage.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') hover=true; });
  stage.addEventListener('pointerleave',()=>{ hover=false; });
  stage.addEventListener('focusin',()=>pause(8000));
  if(!reduce) setInterval(()=>{ if(!hover && !dragging && !document.hidden && performance.now()>pausedUntil) step(1); },3200);

  let px=0, lt=0;
  stage.addEventListener('pointerdown',e=>{ dragging=true; moved=false; px=e.clientX; lt=performance.now(); vel=0; stage.classList.add('drag'); });
  addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-px; if(Math.abs(dx)>3) moved=true; const dd=dx*.28; theta+=dd; const now=performance.now(); vel=dd/Math.max(1,(now-lt)/16.67); lt=now; px=e.clientX; });
  addEventListener('pointerup',()=>{ if(!dragging) return; dragging=false; stage.classList.remove('drag'); if(reduce) vel=0; target=Math.round(theta/STEP)*STEP; pause(6000); setTimeout(()=>moved=false,0); });

  addEventListener('resize',layout); layout(); show(outfit,0); showCard(0); render(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
